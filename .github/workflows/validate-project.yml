name: Validate Godot project
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Godot 4.6.3 (verified SHA-256)
        run: python3 tools/install_godot.py
      - name: Import, resources, smoke test and behavior tests
        run: python3 tools/validate.py
