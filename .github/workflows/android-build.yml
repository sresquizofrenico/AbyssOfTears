name: Build Android Debug APK
on:
  workflow_dispatch:
    inputs:
      require_100_mb:
        description: Exigir al menos 100 MB (desactivar para APK de prueba)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*-public']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Install exact Godot and matching Android templates
        run: python3 tools/install_godot.py --android
      - name: Configure SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" || { echo "::error::Android SDK missing on runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CLI_ZIP="$RUNNER_TEMP/android-commandline-tools.zip"
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" --output "$CLI_ZIP"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $CLI_ZIP" | sha256sum --check
          unzip -q "$CLI_ZIP" -d "$RUNNER_TEMP/android-cli-19"
          SDKMANAGER="$RUNNER_TEMP/android-cli-19/cmdline-tools/bin/sdkmanager"
          # Disable pipefail just for yes: sdkmanager can close stdin before yes exits.
          set +o pipefail
          RESULT=0
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > "$RUNNER_TEMP/sdk-licenses.log" 2>&1 || RESULT=$?
          set -o pipefail
          cat "$RUNNER_TEMP/sdk-licenses.log"
          test "$RESULT" -eq 0 || { echo "::error::No se pudieron aceptar las licencias del SDK"; exit "$RESULT"; }
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Create ephemeral debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/abyss-debug.keystore"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Validate before export
        run: python3 tools/validate.py
      - name: Export and verify signed ARM64 APK
        env:
          REQUIRE_FINAL_CHARACTER_APK: ${{ inputs.require_100_mb && '1' || '0' }}
        run: python3 tools/export_android.py
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AbyssOfTears-Android-Debug
          path: |
            build/AbyssOfTears-debug.apk
            build/apk-size.json
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        shell: bash
        run: |
          echo "### APK generado" >> "$GITHUB_STEP_SUMMARY"
          echo "Descarga AbyssOfTears-Android-Debug en Artifacts, extrae el ZIP e instala AbyssOfTears-debug.apk." >> "$GITHUB_STEP_SUMMARY"
      - name: Explain failure
        if: failure()
        run: echo "::error::No se ha confirmado un APK válido. Revisa el primer paso fallido y sus registros."

  publish:
    name: Publish public Android preview
    needs: android
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-public') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download this run's verified APK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: AbyssOfTears-Android-Debug
          path: build
      - name: Verify, stage and publish the public preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
